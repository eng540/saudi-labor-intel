name: Check audited content and Pages build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: python3 tools/validate_csv.py
      - run: python3 tools/test_audit_regressions.py
      - run: bundle exec jekyll build --trace
      - run: python3 tools/test_audit_regressions.py --site _site
      - uses: actions/upload-artifact@v4
        with:
          name: pages-preview
          path: _site
          retention-days: 7
